<!DOCTYPE html>
<html>
<head>
    <title>Ticket Booking</title>
</head>
<body>

    <h1>Movie Ticket Booking</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Name:</label>
        <input type="text" name="name" required>
        <br><br>

        <label>Movie:</label>
        <select name="movie">
            <option>RRR</option>
            <option>Pushpa</option>
            <option>Baahubali</option>
            <option>Devara</option>
        </select>
        <br><br>

        <label>Number of Tickets:</label>
        <input type="number" name="tickets" min="1" required>
        <br><br>

        <label>Date:</label>
        <input type="date" name="date" required>
        <br><br>

        <button type="submit">Book Ticket</button>
    </form>

</body>
</html>
